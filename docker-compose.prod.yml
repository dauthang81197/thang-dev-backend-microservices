services:
  # Identity Microservice
  identity-service:
    image: course-identity:latest
    container_name: course-identity
    restart: unless-stopped
    build:
      context: .
      dockerfile: apps/identity/Dockerfile
    env_file:
      - .env
    environment:
      NODE_ENV: production
      PORT: 3002
      # Database - sẽ connect đến PostgreSQL đã cài trên EC2
      DB_HOST: ${DB_HOST}
      DB_PORT: ${DB_PORT}
      DB_USER: ${DB_USER}
      DB_PASSWORD: ${DB_PASSWORD}
      DB_NAME: ${DB_NAME}
      # Redis - sẽ connect đến Redis đã cài trên EC2
      REDIS_HOST: ${REDIS_HOST}
      REDIS_PORT: ${REDIS_PORT}
      # JWT
      JWT_SECRET: ${JWT_SECRET}
      JWT_EXPIRES_IN: ${JWT_EXPIRES_IN}
    network_mode: host
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:3002/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s

