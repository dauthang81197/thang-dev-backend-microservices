  # Flower Microservice
  flower-service:
    image: flower-service:latest
    container_name: flower-service
    restart: unless-stopped
    build:
      context: .
      dockerfile: apps/flower/Dockerfile
    env_file:
      - .env
    environment:
      NODE_ENV: production
      PORT: 3004
      # Database - sẽ connect đến PostgreSQL đã cài trên EC2
      DB_HOST: ${DB_HOST}
      DB_PORT: ${DB_PORT}
      DB_USER: ${DB_USER}
      DB_PASSWORD: ${DB_PASSWORD}
      DB_NAME_FLOWER: ${DB_NAME_FLOWER}
      # Redis - sẽ connect đến Redis đã cài trên EC2
      REDIS_HOST: ${REDIS_HOST}
      REDIS_PORT: ${REDIS_PORT}
      # JWT
      JWT_SECRET: ${JWT_SECRET}
    network_mode: host
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:3004/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s

  # API Gateway
  api-gateway:
    image: course-api-gateway:latest
    container_name: course-api-gateway
    restart: unless-stopped
    build:
      context: .
      dockerfile: apps/api-gateway/Dockerfile
    env_file:
      - .env
    environment:
      NODE_ENV: production
      PORT: 8000
      # Redis - sẽ connect đến Redis đã cài trên EC2
      REDIS_HOST: ${REDIS_HOST}
      REDIS_PORT: ${REDIS_PORT}
      # JWT
      JWT_SECRET: ${JWT_SECRET}
      JWT_EXPIRES_IN: ${JWT_EXPIRES_IN}
      # Cloudflare R2
      R2_ACCOUNT_ID: ${R2_ACCOUNT_ID}
      R2_ACCESS_KEY_ID: ${R2_ACCESS_KEY_ID}
      R2_SECRET_ACCESS_KEY: ${R2_SECRET_ACCESS_KEY}
      R2_BUCKET_NAME: ${R2_BUCKET_NAME}
      R2_PUBLIC_URL: ${R2_PUBLIC_URL}
      # CORS
      CORS_ORIGIN: ${CORS_ORIGIN}
    network_mode: host
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s

networks:
  course-network:
    driver: bridge
