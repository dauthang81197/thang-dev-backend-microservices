apiVersion: apps/v1
kind: Deployment
metadata:
  name: identity
spec:
  replicas: 2
  selector:
    matchLabels:
      app: identity
  template:
    metadata:
      labels:
        app: identity
    spec:
      containers:
        - name: identity
          image: dauthang811/identity:latest
          ports:
            - containerPort: 8000
          env:
            - name: NODE_ENV
              value: production
