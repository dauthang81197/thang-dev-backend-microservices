apiVersion: apps/v1
kind: Deployment
metadata:
  name: course
spec:
  replicas: 2
  selector:
    matchLabels:
      app: course
  template:
    metadata:
      labels:
        app: course
    spec:
      containers:
        - name: course
          image: dauthang811/course:latest
          ports:
            - containerPort: 8000
          env:
            - name: NODE_ENV
              value: production
