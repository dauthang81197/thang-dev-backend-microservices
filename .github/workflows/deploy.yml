name: Deploy Backend Microservices to EC2

on:
  push:
    branches:
      - dev
  pull_request:
    branches:
      - dev
  workflow_dispatch:

env:
  EC2_HOST: ${{ secrets.EC2_HOST_BACKEND }}
  EC2_USER: ${{ secrets.EC2_USER }}
  DOCKER_USERNAME: ${{ secrets.DOCKER_USERNAME }}

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      # -------- LINT CHECK --------
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Run lint
        run: npm run lint
        continue-on-error: true

      # -------- BUILD DOCKER IMAGES --------
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to Docker Hub (Optional)
        if: ${{ env.DOCKER_USERNAME != '' }}
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      - name: Build API Gateway Image
        run: |
          docker build -f apps/api-gateway/Dockerfile -t course-api-gateway:latest .
          docker save course-api-gateway:latest | gzip > api-gateway.tar.gz

      - name: Build Identity Service Image
        run: |
          docker build -f apps/identity/Dockerfile -t course-identity:latest .
          docker save course-identity:latest | gzip > identity-service.tar.gz

      - name: Build Course Service Image
        run: |
          docker build -f apps/course/Dockerfile -t course-service:latest .
          docker save course-service:latest | gzip > course-service.tar.gz

      # -------- DEPLOY (CHỈ KHI PUSH) --------
      - name: Prepare SSH key
        if: ${{ github.event_name == 'push' }}
        run: |
          mkdir -p ~/.ssh
          echo "${{ secrets.EC2_SSH_KEY }}" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          ssh-keyscan -H ${{ env.EC2_HOST }} >> ~/.ssh/known_hosts

      - name: Copy Docker images to EC2
        if: ${{ github.event_name == 'push' }}
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ env.EC2_HOST }}
          username: ${{ env.EC2_USER }}
          key: ${{ secrets.EC2_SSH_KEY }}
          source: 'api-gateway.tar.gz,identity-service.tar.gz,course-service.tar.gz,docker-compose.yml'
          target: '/home/${{ env.EC2_USER }}/course-backend'

      - name: Deploy on EC2
        if: ${{ github.event_name == 'push' }}
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ env.EC2_HOST }}
          username: ${{ env.EC2_USER }}
          key: ${{ secrets.EC2_SSH_KEY }}
          script: |
            cd /home/${{ env.EC2_USER }}/course-backend

            # Load Docker images
            echo "📦 Loading API Gateway image..."
            docker load < api-gateway.tar.gz

            echo "📦 Loading Identity Service image..."
            docker load < identity-service.tar.gz

            echo "📦 Loading Course Service image..."
            docker load < course-service.tar.gz

            # Clean up tar files
            rm -f *.tar.gz

            # Create .env file
            cat > .env << EOF
            NODE_ENV=production

            # Database
            DB_USER=${{ secrets.DB_USER }}
            DB_PASSWORD=${{ secrets.DB_PASSWORD }}
            DB_NAME=${{ secrets.DB_NAME }}
            DB_PORT=5432

            # Redis
            REDIS_PORT=6379

            # JWT
            JWT_SECRET=${{ secrets.JWT_SECRET }}
            JWT_EXPIRES_IN=7d

            # Cloudflare R2
            R2_ACCOUNT_ID=${{ secrets.R2_ACCOUNT_ID }}
            R2_ACCESS_KEY_ID=${{ secrets.R2_ACCESS_KEY_ID }}
            R2_SECRET_ACCESS_KEY=${{ secrets.R2_SECRET_ACCESS_KEY }}
            R2_BUCKET_NAME=${{ secrets.R2_BUCKET_NAME }}
            R2_PUBLIC_URL=${{ secrets.R2_PUBLIC_URL }}

            # API Gateway
            API_PORT=3001
            CORS_ORIGIN=${{ secrets.CORS_ORIGIN }}
            EOF

            # Stop old containers
            echo "🛑 Stopping old containers..."
            docker compose down

            # Start new containers
            echo "🚀 Starting new containers..."
            docker compose up -d

            # Clean up old images
            echo "🧹 Cleaning up old images..."
            docker image prune -f

            # Show status
            echo "📊 Container status:"
            docker compose ps

      - name: Verify deployment
        if: ${{ github.event_name == 'push' }}
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ env.EC2_HOST }}
          username: ${{ env.EC2_USER }}
          key: ${{ secrets.EC2_SSH_KEY }}
          script: |
            cd /home/${{ env.EC2_USER }}/course-backend

            # Wait for services to be ready
            echo "⏳ Waiting for services to start..."
            sleep 30

            # Check if all containers are running
            CONTAINERS_UP=$(docker compose ps | grep -c "Up")
            EXPECTED_CONTAINERS=5  # postgres, redis, identity, course, api-gateway

            if [ "$CONTAINERS_UP" -ge "$EXPECTED_CONTAINERS" ]; then
              echo "✅ Deployment successful!"
              echo ""
              echo "📊 Container status:"
              docker compose ps
              echo ""
              echo "📝 Recent logs from API Gateway:"
              docker compose logs --tail=30 api-gateway
              echo ""
              echo "🔍 Health check:"
              curl -f http://localhost:3001/health || echo "⚠️ Health check failed"
            else
              echo "❌ Deployment failed!"
              echo "Expected $EXPECTED_CONTAINERS containers, but only $CONTAINERS_UP are running"
              echo ""
              echo "📊 Container status:"
              docker compose ps
              echo ""
              echo "❌ Error logs:"
              docker compose logs --tail=100
              exit 1
            fi

      - name: Notify deployment status
        if: always()
        run: |
          if [ "${{ job.status }}" == "success" ]; then
            echo "✅ Deployment completed successfully!"
          else
            echo "❌ Deployment failed!"
          fi
