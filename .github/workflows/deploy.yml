name: Deploy Backend Microservices to VPS

on:
  push:
    branches:
      - dev
  pull_request:
    branches:
      - dev
  workflow_dispatch:

env:
  VPS_HOST: ${{ secrets.VPS_HOST }}
  VPS_USER: ${{ secrets.VPS_USER }}
  DOCKER_USERNAME: ${{ secrets.DOCKER_USERNAME }}

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    if: always()

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      # -------- LINT CHECK --------
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Run lint
        run: npm run lint
        continue-on-error: true

      # -------- BUILD DOCKER IMAGES --------
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to Docker Hub (Optional)
        if: ${{ env.DOCKER_USERNAME != '' }}
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      - name: Build API Gateway Image
        run: |
          docker build -f apps/api-gateway/Dockerfile -t course-api-gateway:latest .
          docker save course-api-gateway:latest | gzip > api-gateway.tar.gz

      - name: Build Identity Service Image
        run: |
          docker build -f apps/identity/Dockerfile -t course-identity:latest .

      - name: Debug Identity Build Output
        run: |
          echo "🔍 Checking builder stage output..."
          docker build -f apps/identity/Dockerfile --target builder -t identity-builder:debug .
          echo ""
          echo "📁 Contents of /app in builder stage:"
          docker run --rm identity-builder:debug ls -la /app/
          echo ""
          echo "📁 Contents of /app/dist in builder stage:"
          docker run --rm identity-builder:debug ls -la /app/dist/ || echo "❌ No dist directory"
          echo ""
          echo "📁 Contents of /app/dist/apps in builder stage:"
          docker run --rm identity-builder:debug ls -la /app/dist/apps/ || echo "❌ No dist/apps directory"
          echo ""
          echo "🔍 Finding all main.js files in builder:"
          docker run --rm identity-builder:debug find /app -name "main.js" 2>/dev/null || echo "❌ No main.js found"

      - name: Save Identity Service Image
        run: |
          docker save course-identity:latest | gzip > identity-service.tar.gz

      - name: Debug Identity Image Structure
        run: |
          echo "🔍 Checking Identity image file structure..."
          docker run --rm course-identity:latest ls -la /app/
          echo ""
          echo "🔍 Checking dist directory..."
          docker run --rm course-identity:latest ls -la /app/dist/ || echo "❌ No /app/dist directory"
          echo ""
          echo "🔍 Checking dist/apps directory..."
          docker run --rm course-identity:latest ls -la /app/dist/apps/ || echo "❌ No /app/dist/apps directory"
          echo ""
          echo "🔍 Checking for main.js..."
          docker run --rm course-identity:latest find /app -name "main.js" || echo "❌ No main.js found"

      - name: Build Course Service Image
        run: |
          docker build -f apps/course/Dockerfile -t course-service:latest .
          docker save course-service:latest | gzip > course-service.tar.gz

      - name: Build Expenses Service Image
        run: |
          docker build -f apps/expenses/Dockerfile -t expenses-service:latest .
          docker save expenses-service:latest | gzip > expenses-service.tar.gz

      # -------- DEPLOY (CHỈ KHI PUSH) --------
      - name: Prepare SSH key
        if: ${{ github.event_name == 'push' }}
        env:
          SSH_PRIVATE_KEY: ${{ secrets.VPS_SSH_KEY }}
        run: |
          mkdir -p ~/.ssh
          chmod 700 ~/.ssh

          # Write key and ensure proper format (no Windows \r, trailing newline)
          printf '%s' "$SSH_PRIVATE_KEY" | tr -d '\r' > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key

          # Ensure key ends with newline (required by OpenSSH)
          [ -n "$(tail -c 1 ~/.ssh/deploy_key)" ] && echo "" >> ~/.ssh/deploy_key

          # Validate key format
          echo "🔑 SSH key info:"
          head -1 ~/.ssh/deploy_key
          tail -1 ~/.ssh/deploy_key
          wc -l ~/.ssh/deploy_key
          ssh-keygen -lf ~/.ssh/deploy_key || { echo "❌ Invalid key format! Check VPS_SSH_KEY secret."; exit 1; }

          # Add host to known_hosts
          ssh-keyscan -H ${{ env.VPS_HOST }} >> ~/.ssh/known_hosts 2>/dev/null

          # Test SSH connection (fail the step if it doesn't work)
          echo "🔑 Testing SSH connection to ${{ env.VPS_USER }}@${{ env.VPS_HOST }}..."
          ssh -i ~/.ssh/deploy_key -o StrictHostKeyChecking=no -o BatchMode=yes -o ConnectTimeout=10 -v ${{ env.VPS_USER }}@${{ env.VPS_HOST }} "echo '✅ SSH connection successful'" 2>&1 | grep -E "Authentication|Offering|Trying|debug1: (Authentications|Next|Server)" || true
          ssh -i ~/.ssh/deploy_key -o StrictHostKeyChecking=no -o BatchMode=yes -o ConnectTimeout=10 ${{ env.VPS_USER }}@${{ env.VPS_HOST }} "echo '✅ SSH connection successful'" || { echo "❌ SSH connection failed! Check VPS_SSH_KEY, VPS_USER, and VPS_HOST secrets. Also ensure the public key is in ~/.ssh/authorized_keys on the VPS."; exit 1; }

      - name: Copy Docker images to VPS
        if: ${{ github.event_name == 'push' }}
        run: |
          # Create target directory on VPS
          ssh -i ~/.ssh/deploy_key -o StrictHostKeyChecking=no ${{ env.VPS_USER }}@${{ env.VPS_HOST }} "mkdir -p ~/course-backend"

          # Copy Docker images and docker-compose.prod.yml
          scp -i ~/.ssh/deploy_key -o StrictHostKeyChecking=no \
            api-gateway.tar.gz \
            identity-service.tar.gz \
            course-service.tar.gz \
            expenses-service.tar.gz \
            docker-compose.prod.yml \
            ${{ env.VPS_USER }}@${{ env.VPS_HOST }}:~/course-backend/

      - name: Deploy on VPS
        if: ${{ github.event_name == 'push' }}
        run: |
          ssh -i ~/.ssh/deploy_key -o StrictHostKeyChecking=no ${{ env.VPS_USER }}@${{ env.VPS_HOST }} << 'ENDSSH'
            cd ~/course-backend

            # Kiểm tra file .env có tồn tại không
            if [ ! -f .env ]; then
              echo "⚠️ WARNING: .env file not found!"
              echo "Please create .env file on VPS with all required environment variables."
              echo "See .env.production.example for reference."
              exit 1
            fi

            # Stop old containers first
            echo "🛑 Stopping old containers..."
            docker compose -f docker-compose.prod.yml down

            # Remove old images to ensure clean load
            echo "🗑️ Removing old images..."
            docker rmi course-api-gateway:latest course-identity:latest course-service:latest expenses-service:latest 2>/dev/null || true

            # Load Docker images
            echo "📦 Loading API Gateway image..."
            docker load < api-gateway.tar.gz
            
            echo "📦 Loading Identity Service image..."
            docker load < identity-service.tar.gz
            
            echo "📦 Loading Course Service image..."
            docker load < course-service.tar.gz

            echo "📦 Loading Expenses Service image..."
            docker load < expenses-service.tar.gz
            
            # Clean up tar files
            rm -f *.tar.gz

            # Start new containers with docker-compose.prod.yml
            echo "🚀 Starting containers with docker-compose.prod.yml..."
            docker compose -f docker-compose.prod.yml up -d

            # Clean up old images
            echo "🧹 Cleaning up old images..."
            docker image prune -f

            # Show status
            echo "📊 Container status:"
            docker compose -f docker-compose.prod.yml ps
          ENDSSH

      - name: Verify deployment
        if: ${{ github.event_name == 'push' }}
        run: |
          ssh -i ~/.ssh/deploy_key -o StrictHostKeyChecking=no ${{ env.VPS_USER }}@${{ env.VPS_HOST }} << 'ENDSSH'
            cd ~/course-backend

            # Wait for services to be ready
            echo "⏳ Waiting for services to start..."
            sleep 30

            # Check if all containers are running (3 microservices + 1 API gateway)
            CONTAINERS_UP=$(docker compose -f docker-compose.prod.yml ps --filter "status=running" --format json 2>/dev/null | wc -l || echo "0")
            EXPECTED_CONTAINERS=4

            echo "📊 Container status:"
            docker compose -f docker-compose.prod.yml ps

            if [ "$CONTAINERS_UP" -ge "$EXPECTED_CONTAINERS" ]; then
              echo ""
              echo "✅ Deployment successful! All $CONTAINERS_UP/$EXPECTED_CONTAINERS containers are running."
              echo ""
              echo "📝 Recent logs from API Gateway:"
              docker compose -f docker-compose.prod.yml logs --tail=20 api-gateway
              echo ""
              echo "🔍 Health check:"
              curl -f http://localhost:8000/health || echo "⚠️ Health check failed"
            else
              echo ""
              echo "❌ Deployment failed!"
              echo "Expected $EXPECTED_CONTAINERS containers, but only $CONTAINERS_UP are running"
              echo ""
              echo "❌ Detailed logs for each service:"
              echo ""
              echo "=== IDENTITY SERVICE LOGS ==="
              docker compose -f docker-compose.prod.yml logs --tail=50 identity-service
              echo ""
              echo "=== COURSE SERVICE LOGS ==="
              docker compose -f docker-compose.prod.yml logs --tail=50 course-service
              echo ""
              echo "=== EXPENSES SERVICE LOGS ==="
              docker compose -f docker-compose.prod.yml logs --tail=50 expenses-service
              echo ""
              echo "=== API GATEWAY LOGS ==="
              docker compose -f docker-compose.prod.yml logs --tail=50 api-gateway
              exit 1
            fi
          ENDSSH

      - name: Notify deployment status
        if: always()
        run: |
          if [ "${{ job.status }}" == "success" ]; then
            echo "✅ Deployment completed successfully!"
          else
            echo "❌ Deployment failed!"
          fi
