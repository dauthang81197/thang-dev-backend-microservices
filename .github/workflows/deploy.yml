name: Deploy Backend Microservices to EC2 (Production)

on:
  push:
    branches:
      - main
      - master
  workflow_dispatch:

env:
  EC2_HOST: ${{ secrets.EC2_HOST }}
  EC2_USER: ${{ secrets.EC2_USER }}

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      # -------- LINT CHECK --------
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Run lint
        run: npm run lint
        continue-on-error: true

      # -------- BUILD DOCKER IMAGES --------
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build API Gateway Image
        run: |
          docker build -f apps/api-gateway/Dockerfile -t course-api-gateway:latest .
          docker save course-api-gateway:latest | gzip > api-gateway.tar.gz

      - name: Build Identity Service Image
        run: |
          docker build -f apps/identity/Dockerfile -t course-identity:latest .
          docker save course-identity:latest | gzip > identity-service.tar.gz

      - name: Build Course Service Image
        run: |
          docker build -f apps/course/Dockerfile -t course-service:latest .
          docker save course-service:latest | gzip > course-service.tar.gz

      # -------- DEPLOY TO EC2 --------
      - name: Prepare SSH key
        run: |
          mkdir -p ~/.ssh
          echo "${{ secrets.EC2_SSH_KEY }}" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          ssh-keyscan -H ${{ env.EC2_HOST }} >> ~/.ssh/known_hosts

      - name: Copy files to EC2
        run: |
          # Create target directory on EC2
          ssh -i ~/.ssh/deploy_key -o StrictHostKeyChecking=no ${{ env.EC2_USER }}@${{ env.EC2_HOST }} "mkdir -p ~/course-backend"

          # Copy Docker images and docker-compose.prod.yml
          scp -i ~/.ssh/deploy_key -o StrictHostKeyChecking=no \
            api-gateway.tar.gz \
            identity-service.tar.gz \
            course-service.tar.gz \
            docker-compose.prod.yml \
            ${{ env.EC2_USER }}@${{ env.EC2_HOST }}:~/course-backend/

      - name: Deploy on EC2
        run: |
          ssh -i ~/.ssh/deploy_key -o StrictHostKeyChecking=no ${{ env.EC2_USER }}@${{ env.EC2_HOST }} << 'ENDSSH'
            cd ~/course-backend

            # Kiểm tra .env.production file
            if [ ! -f .env.production ]; then
              echo "⚠️ WARNING: .env.production file not found!"
              echo "Please create .env.production file on EC2 with all required environment variables."
              echo "See .env.production.example for reference."
              exit 1
            fi

            # Stop old containers
            echo "🛑 Stopping old containers..."
            docker compose -f docker-compose.prod.yml down

            # Remove old images
            echo "🗑️ Removing old images..."
            docker rmi course-api-gateway:latest course-identity:latest course-service:latest 2>/dev/null || true

            # Load Docker images
            echo "📦 Loading API Gateway image..."
            docker load < api-gateway.tar.gz
            
            echo "📦 Loading Identity Service image..."
            docker load < identity-service.tar.gz
            
            echo "📦 Loading Course Service image..."
            docker load < course-service.tar.gz
            
            # Clean up tar files
            rm -f *.tar.gz

            # Start new containers with production compose file
            echo "🚀 Starting containers with docker-compose.prod.yml..."
            docker compose -f docker-compose.prod.yml --env-file .env.production up -d

            # Clean up old images
            echo "🧹 Cleaning up old images..."
            docker image prune -f

            # Show status
            echo "📊 Container status:"
            docker compose -f docker-compose.prod.yml ps
          ENDSSH

      - name: Verify deployment
        run: |
          ssh -i ~/.ssh/deploy_key -o StrictHostKeyChecking=no ${{ env.EC2_USER }}@${{ env.EC2_HOST }} << 'ENDSSH'
            cd ~/course-backend

            # Wait for services to start
            echo "⏳ Waiting for services to start..."
            sleep 30

            # Check running containers
            CONTAINERS_UP=$(docker compose -f docker-compose.prod.yml ps --filter "status=running" --format json 2>/dev/null | wc -l || echo "0")
            EXPECTED_CONTAINERS=3

            echo "📊 Container status:"
            docker compose -f docker-compose.prod.yml ps

            if [ "$CONTAINERS_UP" -ge "$EXPECTED_CONTAINERS" ]; then
              echo ""
              echo "✅ Deployment successful! All $CONTAINERS_UP/$EXPECTED_CONTAINERS containers are running."
              echo ""
              echo "📝 Recent logs from API Gateway:"
              docker compose -f docker-compose.prod.yml logs --tail=20 api-gateway
              echo ""
              echo "🔍 Health check:"
              curl -f http://localhost:8000/health || echo "⚠️ Health check failed"
            else
              echo ""
              echo "❌ Deployment failed!"
              echo "Expected $EXPECTED_CONTAINERS containers, but only $CONTAINERS_UP are running"
              echo ""
              echo "❌ Detailed logs for each service:"
              echo ""
              echo "=== IDENTITY SERVICE LOGS ==="
              docker compose -f docker-compose.prod.yml logs --tail=50 identity-service
              echo ""
              echo "=== COURSE SERVICE LOGS ==="
              docker compose -f docker-compose.prod.yml logs --tail=50 course-service
              echo ""
              echo "=== API GATEWAY LOGS ==="
              docker compose -f docker-compose.prod.yml logs --tail=50 api-gateway
              exit 1
            fi
          ENDSSH

      - name: Deployment Summary
        if: always()
        run: |
          if [ "${{ job.status }}" == "success" ]; then
            echo "✅ Deployment completed successfully!"
            echo ""
            echo "🌐 Services are running on EC2:"
            echo "   - API Gateway: http://${{ env.EC2_HOST }}:8000"
            echo "   - Identity Service: http://${{ env.EC2_HOST }}:3002"
            echo "   - Course Service: http://${{ env.EC2_HOST }}:3003"
          else
            echo "❌ Deployment failed!"
            echo "Please check the logs above for more details."
          fi
