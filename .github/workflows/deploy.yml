name: Deploy Backend Microservices to VPS

on:
  push:
    branches:
      - dev
  pull_request:
    branches:
      - dev
  workflow_dispatch:

env:
  VPS_HOST: ${{ secrets.VPS_HOST }}
  VPS_USER: ${{ secrets.VPS_USER }}
  DOCKER_USERNAME: ${{ secrets.DOCKER_USERNAME }}

jobs:
  # ======== JOB 1: Detect which services changed ========
  detect-changes:
    runs-on: ubuntu-latest
    outputs:
      api-gateway: ${{ steps.changes.outputs.api-gateway }}
      identity: ${{ steps.changes.outputs.identity }}
      flower: ${{ steps.changes.outputs.flower }}
      notification: ${{ steps.changes.outputs.notification }}
      any-service: ${{ steps.changes.outputs.any-service }}
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Detect changed services
        id: changes
        run: |
          # For workflow_dispatch, build all
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            echo "🔄 Manual trigger - building ALL services"
            echo "api-gateway=true" >> $GITHUB_OUTPUT
            echo "identity=true" >> $GITHUB_OUTPUT
            echo "flower=true" >> $GITHUB_OUTPUT
            echo "notification=true" >> $GITHUB_OUTPUT
            echo "any-service=true" >> $GITHUB_OUTPUT
            exit 0
          fi

          # Get changed files between commits
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            CHANGED_FILES=$(git diff --name-only ${{ github.event.pull_request.base.sha }} ${{ github.sha }} || echo "")
          else
            CHANGED_FILES=$(git diff --name-only ${{ github.event.before }} ${{ github.sha }} || echo "")
          fi

          echo "📝 Changed files:"
          echo "$CHANGED_FILES"
          echo ""

          # Check if shared code changed (libs/, package.json, tsconfig, etc.)
          SHARED_CHANGED=false
          if echo "$CHANGED_FILES" | grep -qE "^(libs/|package\.json|package-lock\.json|tsconfig\.json|tsconfig\.build\.json|nest-cli\.json|docker-compose\.prod\.yml)"; then
            SHARED_CHANGED=true
            echo "⚠️ Shared code changed - will rebuild ALL services"
          fi

          # Detect per-service changes
          GW_CHANGED=false
          ID_CHANGED=false
          FL_CHANGED=false
          NT_CHANGED=false

          if [ "$SHARED_CHANGED" = "true" ] || echo "$CHANGED_FILES" | grep -qE "^apps/api-gateway/"; then
            GW_CHANGED=true
          fi
          if [ "$SHARED_CHANGED" = "true" ] || echo "$CHANGED_FILES" | grep -qE "^apps/identity/"; then
            ID_CHANGED=true
          fi
          if [ "$SHARED_CHANGED" = "true" ] || echo "$CHANGED_FILES" | grep -qE "^apps/flower/"; then
            FL_CHANGED=true
          fi
          if [ "$SHARED_CHANGED" = "true" ] || echo "$CHANGED_FILES" | grep -qE "^apps/notification/"; then
            NT_CHANGED=true
          fi

          ANY_SERVICE=false
          if [ "$GW_CHANGED" = "true" ] || [ "$ID_CHANGED" = "true" ] || [ "$FL_CHANGED" = "true" ] || [ "$NT_CHANGED" = "true" ]; then
            ANY_SERVICE=true
          fi

          echo ""
          echo "📊 Build decisions:"
          echo "  API Gateway:   $GW_CHANGED"
          echo "  Identity:      $ID_CHANGED"
          echo "  Flower:        $FL_CHANGED"
          echo "  Notification:  $NT_CHANGED"
          echo "  Any service:   $ANY_SERVICE"

          echo "api-gateway=$GW_CHANGED" >> $GITHUB_OUTPUT
          echo "identity=$ID_CHANGED" >> $GITHUB_OUTPUT
          echo "flower=$FL_CHANGED" >> $GITHUB_OUTPUT
          echo "notification=$NT_CHANGED" >> $GITHUB_OUTPUT
          echo "any-service=$ANY_SERVICE" >> $GITHUB_OUTPUT

  # ======== JOB 2: Lint ========
  lint:
    runs-on: ubuntu-latest
    needs: detect-changes
    if: needs.detect-changes.outputs.any-service == 'true'

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Run lint
        run: npm run lint

  # ======== JOB 3: Build Docker Images ========
  build:
    runs-on: ubuntu-latest
    needs: [detect-changes, lint]
    if: needs.detect-changes.outputs.any-service == 'true'

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Show build plan
        run: |
          echo "🏗️ Build plan:"
          echo "  API Gateway:   ${{ needs.detect-changes.outputs.api-gateway }}"
          echo "  Identity:      ${{ needs.detect-changes.outputs.identity }}"
          echo "  Flower:        ${{ needs.detect-changes.outputs.flower }}"
          echo "  Notification:  ${{ needs.detect-changes.outputs.notification }}"

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to Docker Hub (Optional)
        if: ${{ env.DOCKER_USERNAME != '' }}
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      - name: Build API Gateway Image
        if: needs.detect-changes.outputs.api-gateway == 'true'
        run: |
          echo "🔨 Building API Gateway..."
          docker build -f apps/api-gateway/Dockerfile -t course-api-gateway:latest .
          docker save course-api-gateway:latest | gzip > api-gateway.tar.gz
          echo "✅ API Gateway image built"

      - name: Build Identity Service Image
        if: needs.detect-changes.outputs.identity == 'true'
        run: |
          echo "🔨 Building Identity Service..."
          docker build -f apps/identity/Dockerfile -t course-identity:latest .
          docker save course-identity:latest | gzip > identity-service.tar.gz
          echo "✅ Identity Service image built"

      - name: Build Flower Service Image
        if: needs.detect-changes.outputs.flower == 'true'
        run: |
          echo "🔨 Building Flower Service..."
          docker build -f apps/flower/Dockerfile -t flower-service:latest .
          docker save flower-service:latest | gzip > flower-service.tar.gz
          echo "✅ Flower Service image built"

      - name: Build Notification Service Image
        if: needs.detect-changes.outputs.notification == 'true'
        run: |
          echo "🔨 Building Notification Service..."
          docker build -f apps/notification/Dockerfile -t notification-service:latest .
          docker save notification-service:latest | gzip > notification-service.tar.gz
          echo "✅ Notification Service image built"

      - name: Upload build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: docker-images
          retention-days: 1
          path: |
            *.tar.gz
            docker-compose.prod.yml

  # ======== JOB 4: Deploy to VPS ========
  deploy:
    runs-on: ubuntu-latest
    needs: [detect-changes, build]
    if: github.event_name == 'push'

    steps:
      - name: Download build artifacts
        uses: actions/download-artifact@v4
        with:
          name: docker-images

      - name: Show deploy plan
        run: |
          echo "🚀 Deploy plan:"
          echo "  API Gateway:   ${{ needs.detect-changes.outputs.api-gateway }}"
          echo "  Identity:      ${{ needs.detect-changes.outputs.identity }}"
          echo "  Flower:        ${{ needs.detect-changes.outputs.flower }}"
          echo "  Notification:  ${{ needs.detect-changes.outputs.notification }}"
          echo ""
          echo "📦 Artifacts downloaded:"
          ls -lh *.tar.gz 2>/dev/null || echo "  (no images)"
          ls -lh docker-compose.prod.yml 2>/dev/null || echo "  (no compose file)"

      - name: Prepare SSH key
        env:
          SSH_PRIVATE_KEY: ${{ secrets.VPS_SSH_KEY }}
        run: |
          mkdir -p ~/.ssh
          chmod 700 ~/.ssh

          printf '%s' "$SSH_PRIVATE_KEY" | tr -d '\r' > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          [ -n "$(tail -c 1 ~/.ssh/deploy_key)" ] && echo "" >> ~/.ssh/deploy_key

          echo "🔑 Validating SSH key..."
          ssh-keygen -lf ~/.ssh/deploy_key || { echo "❌ Invalid key format!"; exit 1; }

          ssh-keyscan -H ${{ env.VPS_HOST }} >> ~/.ssh/known_hosts 2>/dev/null

          echo "🔑 Testing SSH connection..."
          ssh -i ~/.ssh/deploy_key -o StrictHostKeyChecking=no -o BatchMode=yes -o ConnectTimeout=10 \
            ${{ env.VPS_USER }}@${{ env.VPS_HOST }} "echo '✅ SSH connection successful'" \
            || { echo "❌ SSH connection failed!"; exit 1; }

      - name: Copy changed images to VPS
        run: |
          SSH_CMD="ssh -i ~/.ssh/deploy_key -o StrictHostKeyChecking=no"
          SCP_CMD="scp -i ~/.ssh/deploy_key -o StrictHostKeyChecking=no"
          TARGET="${{ env.VPS_USER }}@${{ env.VPS_HOST }}"

          $SSH_CMD $TARGET "mkdir -p ~/course-backend"

          echo "📤 Copying docker-compose.prod.yml..."
          $SCP_CMD docker-compose.prod.yml $TARGET:~/course-backend/

          if [ "${{ needs.detect-changes.outputs.api-gateway }}" = "true" ]; then
            echo "📤 Copying API Gateway image..."
            $SCP_CMD api-gateway.tar.gz $TARGET:~/course-backend/
          fi

          if [ "${{ needs.detect-changes.outputs.identity }}" = "true" ]; then
            echo "📤 Copying Identity Service image..."
            $SCP_CMD identity-service.tar.gz $TARGET:~/course-backend/
          fi

          if [ "${{ needs.detect-changes.outputs.flower }}" = "true" ]; then
            echo "📤 Copying Flower Service image..."
            $SCP_CMD flower-service.tar.gz $TARGET:~/course-backend/
          fi

          if [ "${{ needs.detect-changes.outputs.notification }}" = "true" ]; then
            echo "📤 Copying Notification Service image..."
            $SCP_CMD notification-service.tar.gz $TARGET:~/course-backend/
          fi

      - name: Deploy changed services on VPS
        run: |
          ssh -i ~/.ssh/deploy_key -o StrictHostKeyChecking=no ${{ env.VPS_USER }}@${{ env.VPS_HOST }} \
            CHANGED_GW=${{ needs.detect-changes.outputs.api-gateway }} \
            CHANGED_ID=${{ needs.detect-changes.outputs.identity }} \
            CHANGED_FL=${{ needs.detect-changes.outputs.flower }} \
            CHANGED_NT=${{ needs.detect-changes.outputs.notification }} \
            bash << 'ENDSSH'
            cd ~/course-backend

            if [ ! -f .env ]; then
              echo "⚠️ WARNING: .env file not found!"
              exit 1
            fi

            echo "🔄 Services to update:"
            echo "  API Gateway:   $CHANGED_GW"
            echo "  Identity:      $CHANGED_ID"
            echo "  Flower:        $CHANGED_FL"
            echo "  Notification:  $CHANGED_NT"
            echo ""

            # Only stop/reload changed services (other services keep running)
            if [ "$CHANGED_GW" = "true" ]; then
              echo "🛑 Stopping API Gateway..."
              docker compose -f docker-compose.prod.yml stop api-gateway 2>/dev/null || true
              docker compose -f docker-compose.prod.yml rm -f api-gateway 2>/dev/null || true
              docker rmi course-api-gateway:latest 2>/dev/null || true
              echo "📦 Loading API Gateway image..."
              docker load < api-gateway.tar.gz
              rm -f api-gateway.tar.gz
            fi

            if [ "$CHANGED_ID" = "true" ]; then
              echo "🛑 Stopping Identity Service..."
              docker compose -f docker-compose.prod.yml stop identity-service 2>/dev/null || true
              docker compose -f docker-compose.prod.yml rm -f identity-service 2>/dev/null || true
              docker rmi course-identity:latest 2>/dev/null || true
              echo "📦 Loading Identity Service image..."
              docker load < identity-service.tar.gz
              rm -f identity-service.tar.gz
            fi

            if [ "$CHANGED_FL" = "true" ]; then
              echo "🛑 Stopping Flower Service..."
              docker compose -f docker-compose.prod.yml stop flower-service 2>/dev/null || true
              docker compose -f docker-compose.prod.yml rm -f flower-service 2>/dev/null || true
              docker rmi flower-service:latest 2>/dev/null || true
              echo "📦 Loading Flower Service image..."
              docker load < flower-service.tar.gz
              rm -f flower-service.tar.gz
            fi

            if [ "$CHANGED_NT" = "true" ]; then
              echo "🛑 Stopping Notification Service..."
              docker compose -f docker-compose.prod.yml stop notification-service 2>/dev/null || true
              docker compose -f docker-compose.prod.yml rm -f notification-service 2>/dev/null || true
              docker rmi notification-service:latest 2>/dev/null || true
              echo "📦 Loading Notification Service image..."
              docker load < notification-service.tar.gz
              rm -f notification-service.tar.gz
            fi

            echo ""
            echo "🚀 Starting services..."
            docker compose -f docker-compose.prod.yml up -d

            echo "🧹 Cleaning up old images..."
            docker image prune -f

            echo ""
            echo "📊 Container status:"
            docker compose -f docker-compose.prod.yml ps
          ENDSSH

      - name: Verify deployment
        run: |
          ssh -i ~/.ssh/deploy_key -o StrictHostKeyChecking=no ${{ env.VPS_USER }}@${{ env.VPS_HOST }} << 'ENDSSH'
            cd ~/course-backend

            echo "⏳ Waiting for services to start..."
            sleep 30

            CONTAINERS_UP=$(docker compose -f docker-compose.prod.yml ps --filter "status=running" --format json 2>/dev/null | wc -l || echo "0")
            EXPECTED_CONTAINERS=5

            echo "📊 Container status:"
            docker compose -f docker-compose.prod.yml ps

            if [ "$CONTAINERS_UP" -ge "$EXPECTED_CONTAINERS" ]; then
              echo ""
              echo "✅ Deployment successful! All $CONTAINERS_UP/$EXPECTED_CONTAINERS containers are running."
              echo ""
              echo "🔍 Health check:"
              curl -f http://localhost:8000/health || echo "⚠️ Health check failed"
            else
              echo ""
              echo "❌ Deployment failed!"
              echo "Expected $EXPECTED_CONTAINERS containers, but only $CONTAINERS_UP are running"
              echo ""
              echo "=== IDENTITY SERVICE LOGS ==="
              docker compose -f docker-compose.prod.yml logs --tail=50 identity-service
              echo ""
              echo "=== FLOWER SERVICE LOGS ==="
              docker compose -f docker-compose.prod.yml logs --tail=50 flower-service
              echo ""
              echo "=== NOTIFICATION SERVICE LOGS ==="
              docker compose -f docker-compose.prod.yml logs --tail=50 notification-service
              echo ""
              echo "=== API GATEWAY LOGS ==="
              docker compose -f docker-compose.prod.yml logs --tail=50 api-gateway
              exit 1
            fi
          ENDSSH

      - name: Notify deployment status
        if: always()
        run: |
          if [ "${{ job.status }}" == "success" ]; then
            echo "✅ Deployment completed successfully!"
          else
            echo "❌ Deployment failed!"
          fi

  # ======== JOB 5: Skip when no service changes ========
  no-changes:
    runs-on: ubuntu-latest
    needs: detect-changes
    if: needs.detect-changes.outputs.any-service != 'true'
    steps:
      - name: No service changes detected
        run: |
          echo "ℹ️ No service code changes detected - skipping build & deploy."
          echo "Only these paths trigger builds:"
          echo "  - apps/api-gateway/**"
          echo "  - apps/identity/**"
          echo "  - apps/flower/**"
          echo "  - apps/notification/**"
          echo "  - libs/**"
          echo "  - package.json / tsconfig.json / nest-cli.json"

